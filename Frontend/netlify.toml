# Use this file when Netlify "Base directory" is set to Frontend only.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://nhmbackend-production.up.railway.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
